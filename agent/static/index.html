<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>医知有据</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: #eef2f7;
      color: #1f2937;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 760px;
      height: min(720px, calc(100vh - 48px));
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
      overflow: hidden;
    }

    header {
      padding: 18px 22px 14px;
      border-bottom: 1px solid #e5e7eb;
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: #ffffff;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    h1 { margin: 0; font-size: 20px; letter-spacing: 1px; }

    .subtitle {
      margin: 6px 0 0;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
    }

    .header-actions {
      display: flex;
      flex: none;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .new-session,
    .clear-session {
      flex: none;
      padding: 7px 12px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
    }

    .new-session:hover,
    .clear-session:hover { background: rgba(255, 255, 255, 0.22); }

    .clear-session {
      border-color: rgba(254, 202, 202, 0.8);
      background: rgba(185, 28, 28, 0.35);
    }

    /* 窄屏时头部改为纵向，两个按钮等宽排列，保证 312px 下不重叠 */
    @media (max-width: 420px) {
      header {
        flex-direction: column;
        align-items: stretch;
      }

      .header-actions { width: 100%; }

      .new-session,
      .clear-session {
        flex: 1;
        padding: 8px 10px;
        text-align: center;
      }
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #f8fafc;
    }

    .empty-hint {
      margin: auto;
      color: #94a3b8;
      font-size: 14px;
      text-align: center;
      line-height: 1.8;
    }

    .bubble {
      max-width: 82%;
      padding: 11px 15px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble.user {
      align-self: flex-end;
      background: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .bubble.assistant {
      align-self: flex-start;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 4px;
    }

    .bubble.loading { color: #64748b; font-style: italic; }

    .error {
      margin: 0;
      padding: 10px 22px;
      background: #fef2f2;
      border-top: 1px solid #fecaca;
      color: #b91c1c;
      font-size: 13px;
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid #e5e7eb;
      background: #ffffff;
    }

    textarea {
      flex: 1;
      resize: none;
      padding: 11px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      line-height: 1.5;
      outline: none;
    }

    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    button.submit {
      flex: none;
      padding: 0 22px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font-size: 15px;
      cursor: pointer;
    }

    button.submit:hover { background: #1d4ed8; }

    button.submit:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    .disclaimer {
      margin: 0;
      padding: 8px 22px 12px;
      border-top: 1px solid #f1f5f9;
      color: #94a3b8;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>医知有据</h1>
        <p class="subtitle">医学知识、健康管理、用药与就医地点助手</p>
      </div>
      <div class="header-actions">
        <button id="clear-session" class="clear-session" type="button">清空对话</button>
        <button id="new-session" class="new-session" type="button">新会话</button>
      </div>
    </header>

    <section id="messages" class="messages" aria-live="polite">
      <p class="empty-hint">输入问题开始对话<br />例如：什么是高血压？或：查看用药计划</p>
    </section>

    <p id="error" class="error" role="alert" hidden></p>

    <form id="chat-form" class="composer">
      <textarea id="input" rows="2" maxlength="4000" placeholder="输入问题，Ctrl + Enter 发送"></textarea>
      <button id="send" class="submit" type="submit">发送</button>
    </form>

    <p class="disclaimer">本助手仅提供健康信息参考，不能替代医生诊疗；紧急情况请立即拨打 120。</p>
  </main>

  <script>
    const messagesEl = document.getElementById("messages");
    const formEl = document.getElementById("chat-form");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const errorEl = document.getElementById("error");
    const newSessionBtn = document.getElementById("new-session");
    const clearSessionBtn = document.getElementById("clear-session");

    const SESSION_KEY = "medical-agent-session";
    // 与服务端 MAX_MESSAGE_CHARS 保持一致；服务端仍会独立校验
    const MAX_MESSAGE_CHARS = 4000;
    let sessionId = sessionStorage.getItem(SESSION_KEY) || "";
    let loading = false;
    // 会话代号：每点击一次“新会话”加 1，用来判断回复是否已经过期
    let generation = 0;

    // 竞态判定：回复携带的代号与当前代号不一致时，说明用户已经开始了新会话
    function isStaleReply(replyGeneration, currentGeneration) {
      return replyGeneration !== currentGeneration;
    }

    function addBubble(role, text) {
      const hint = messagesEl.querySelector(".empty-hint");
      if (hint) hint.remove();
      const bubble = document.createElement("div");
      bubble.className = "bubble " + role;
      bubble.textContent = text;
      messagesEl.appendChild(bubble);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return bubble;
    }

    function showError(text) {
      errorEl.textContent = text;
      errorEl.hidden = false;
    }

    function hideError() {
      errorEl.textContent = "";
      errorEl.hidden = true;
    }

    function setLoading(value) {
      loading = value;
      sendBtn.disabled = value;
      sendBtn.textContent = value ? "回复中..." : "发送";
    }

    async function sendMessage() {
      const message = inputEl.value.trim();
      if (!message || loading) return;
      if (message.length > MAX_MESSAGE_CHARS) {
        showError("消息过长：最多允许 " + MAX_MESSAGE_CHARS + " 个字符。");
        return;
      }

      // 记录本次请求所属的会话代号
      const requestGeneration = generation;

      hideError();
      addBubble("user", message);
      inputEl.value = "";
      setLoading(true);
      const pending = addBubble("assistant loading", "正在生成回复...");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: message, session_id: sessionId }),
        });
        const data = await response.json().catch(function () { return {}; });

        // 等待期间用户点了“新会话”：丢弃本次结果，
        // 不回写 session_id，也不往新会话里插入消息
        if (isStaleReply(requestGeneration, generation)) {
          return;
        }

        pending.remove();

        if (!response.ok) {
          throw new Error(data.detail || "请求失败，请稍后再试。");
        }
        if (data.session_id) {
          sessionId = data.session_id;
          sessionStorage.setItem(SESSION_KEY, sessionId);
        }
        addBubble("assistant", data.reply || "（空回复）");
      } catch (err) {
        // 过期请求同样不提示错误，避免干扰新会话
        if (isStaleReply(requestGeneration, generation)) {
          return;
        }
        pending.remove();
        showError(err.message || "网络异常，请确认服务已启动。");
      } finally {
        // 只有当前会话的请求才能解除“等待中”状态
        if (!isStaleReply(requestGeneration, generation)) {
          setLoading(false);
          inputEl.focus();
        }
      }
    }

    formEl.addEventListener("submit", function (event) {
      event.preventDefault();
      sendMessage();
    });

    inputEl.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
        event.preventDefault();
        sendMessage();
      }
    });

    // 只清空界面并开始新会话，不删除旧会话的历史；旧会话仍在服务端保留
    function resetMessages(hint) {
      // 代号加 1，让仍在等待的旧请求返回后被丢弃
      generation += 1;
      sessionId = "";
      sessionStorage.removeItem(SESSION_KEY);
      messagesEl.innerHTML = '<p class="empty-hint">' + hint + "</p>";
      hideError();
      // 旧请求不会再解除按钮的等待状态，这里主动恢复
      setLoading(false);
      inputEl.focus();
    }

    // 清空对话：先确认，再请求服务端删除当前会话
    async function clearSession() {
      if (!confirm("确定要清空当前对话吗？清空后历史记录无法恢复。")) {
        return;
      }
      if (!sessionId) {
        resetMessages("已清空对话<br />输入问题继续对话");
        return;
      }

      try {
        const response = await fetch(
          "/api/session/" + encodeURIComponent(sessionId),
          { method: "DELETE" }
        );
        const data = await response.json().catch(function () { return {}; });
        if (!response.ok) {
          throw new Error(data.detail || "清空失败，请稍后再试。");
        }
        resetMessages("已清空对话<br />输入问题继续对话");
      } catch (err) {
        // 删除失败时保留当前会话和气泡，只显示错误提示
        showError(err.message || "清空失败，请稍后再试。");
      }
    }

    newSessionBtn.addEventListener("click", function () {
      // 仅在前端开始新会话，不删除旧会话的数据库快照
      resetMessages("已开始新会话<br />输入问题继续对话");
    });

    clearSessionBtn.addEventListener("click", function () {
      clearSession();
    });

    inputEl.focus();
  </script>
</body>
</html>
